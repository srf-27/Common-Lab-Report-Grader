{% extends "base.html" %}
{% block title %}评分进行中 — 智能评阅{% endblock %}
{% block content %}
<div class="page-header">
    <h1>评分进行中</h1>
    <p class="subtitle">正在按评分细则逐份评阅，完成后自动进入审查；可放心离开此页</p>
</div>

<div class="card progress-card">
    <div class="progress-head">
        <span class="progress-phase" id="phase-text">准备中…</span>
        <span class="progress-count" id="count-text">0 / 0</span>
    </div>
    <div class="progress-track" role="progressbar" aria-labelledby="phase-text">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <p class="progress-current" id="current-text">正在启动评分引擎…</p>
    <div class="progress-error" id="error-box" style="display:none"></div>
    <div class="progress-links">
        <a href="/" class="btn btn-sm">返回工作台</a>
        <a href="/reports_list" class="btn btn-sm">查看报告列表</a>
    </div>
</div>

<script>
(function poll() {
    fetch("/grading_status").then(r => r.json()).then(s => {
        var phase = s.phase || "idle";
        var done = s.done || 0, total = s.total || 0;
        var pct = total ? Math.round(done * 100 / total) : (phase === "done" ? 100 : 4);
        document.getElementById("progress-fill").style.width = pct + "%";
        document.getElementById("count-text").textContent = done + " / " + total;
        var phaseText = document.getElementById("phase-text");
        var cur = document.getElementById("current-text");
        if (phase === "running") {
            phaseText.textContent = "评分中";
            cur.textContent = s.current ? "正在评阅：" + s.current : "正在启动评分引擎…";
        } else if (phase === "needs_review") {
            phaseText.textContent = "等待人工审查";
            cur.textContent = "本批次已完成，即将进入审查页…";
            setTimeout(function () { location.href = "/review_batch"; }, 800);
        } else if (phase === "done") {
            phaseText.textContent = "全部完成";
            cur.textContent = "评分完成，正在打开结果页…";
            setTimeout(function () { location.href = "/grading_done"; }, 800);
        } else if (phase === "error") {
            phaseText.textContent = "评分出错";
            cur.textContent = "";
            var box = document.getElementById("error-box");
            box.style.display = "block";
            box.textContent = s.message || "未知错误";
            return;
        }
        setTimeout(poll, 2000);
    }).catch(function () { setTimeout(poll, 3000); });
})();
</script>
{% endblock %}
