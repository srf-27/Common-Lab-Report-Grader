[project]
name = "experiment-report-grader"
version = "0.1.0"
description = "AI-powered experiment report grading system for university physics courses"
authors = [
    { name = "srf-27", email = "srf-27@163.com" }
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "python-docx>=1.0.0",
    "pymupdf>=1.23.0",
    "pymupdf4llm>=1.28.0",
    "paddleocr>=2.7",
    "paddlepaddle>=2.5",
    "chromadb>=0.5",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "rarfile>=4.1",
    "py7zr>=0.21",
    "numpy>=1.24",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
